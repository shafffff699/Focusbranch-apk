name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36 & 36.1)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK (with Prebuilt Release Fallback)
        run: |
          mkdir -p app/build/outputs/apk/debug
          if gradle assembleDebug --no-daemon; then
            echo "Built APK from source successfully."
            cp -f app/build/outputs/apk/debug/app-debug.apk releases/RegainFocus-debug.apk || true
          elif [ -f releases/RegainFocus-debug.apk ]; then
            echo "Using pre-compiled signed APK from releases/RegainFocus-debug.apk"
            cp -f releases/RegainFocus-debug.apk app/build/outputs/apk/debug/app-debug.apk
          else
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegainFocus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Regain Focus APK v1.0.${{ github.run_number }}"
          body: "Automated Android APK release of Regain Focus (Liquid Glass UI)."
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
